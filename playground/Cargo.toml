[package]
name = "htmd-playground"
version = "0.1.0"
edition = "2024"
publish = false
description = "Browser playground for htmd (HTML to Markdown) and pulldown-cmark (Markdown to HTML)."
license = "Apache-2.0"

# A workspace of its own, so the playground never joins htmd's build.
[workspace]

[dependencies]
htmd = { path = ".." }
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
html5ever = "0.39"
markup5ever_rcdom = "0.39"
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Location", "History", "Navigator", "Clipboard", "Performance", "MediaQueryList", "HtmlTextAreaElement", "HtmlInputElement", "HtmlSelectElement", "KeyboardEvent"] }
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
base64 = "0.22"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
