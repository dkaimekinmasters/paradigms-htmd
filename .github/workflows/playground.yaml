name: Playground

# Builds the playground in `playground/` on every pull request, and publishes
# it to GitHub Pages on every push to main. The library's own CI is ci.yaml.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.22.1

jobs:
  build:
    name: Build playground
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground

    steps:
      - uses: actions/checkout@v4

      - name: Update Rust
        run: |
          rustup update stable && rustup default stable
          rustup target add wasm32-unknown-unknown
          rustup component add clippy

      - name: Install trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin"

      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown -- --deny warnings

      - name: Test
        run: cargo test

      - name: Build site
        run: trunk build --release --public-url /paradigms-htmd/

      - name: Check size
        run: |
          total=$(find dist -type f -exec gzip -9 -c {} \; | wc -c)
          echo "gzipped site: $total bytes"
          test "$total" -lt 1000000

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
